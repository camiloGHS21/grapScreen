<!doctype html>
<html lang="es" data-theme="light">
<head>
<meta charset="UTF-8"/>
<title>grapScreen — Verificación: switch multi-puerto + barra única</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="./live.css"/>
<style>
  html, body, #root { height: 100%; }
  body { margin: 0; background: var(--bg); display: flex; flex-direction: column; }
  .pv-wrap { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 10px; padding: 10px 12px 12px; }
  .pv-checks { display: flex; gap: 18px; flex-wrap: wrap; padding: 10px 14px; background: var(--s1);
    border: 1px solid var(--line); border-radius: 12px; font: 500 11.5px Manrope, sans-serif; color: var(--muted); }
  .pv-checks b { color: var(--text); }
  .pv-ok { color: var(--mint); font-weight: 700; }
  /* Geometry constants mirroring Flowchart.tsx */
  .n8n-node { position: absolute; }
</style>
</head>
<body>
<div id="root">
  <div class="pv-wrap">

    <!-- Single top bar (EditorTopBar with inline stats) -->
    <div class="flow-topbar">
      <div class="ftb-left">
        <button class="ftb-back">&#8249;</button>
        <div class="ftb-crumb">
          <span class="ftb-crumb-scope">demo_formulario_excel</span>
          <span class="ftb-crumb-sep">/</span>
          <button class="ftb-crumb-name">wad3</button>
        </div>
        <div class="ftb-stats">
          <span class="ftb-stat"><em>Duración</em><b>00:00</b></span>
          <span class="ftb-stat"><em>Pasos</em><b>15</b></span>
          <span class="ftb-stat"><em>Video</em><b>&mdash;</b></span>
        </div>
      </div>
      <div class="ftb-tabs">
        <button class="ftb-tab active">Editor</button>
        <button class="ftb-tab">Ejecuciones</button>
        <button class="ftb-tab">Evaluaciones</button>
        <button class="ftb-tab">Triggers</button>
      </div>
      <div class="ftb-right">
        <button class="ftb-btn ghost">&#9889; Inactiva</button>
        <button class="ftb-btn ghost">Historial</button>
        <span class="ftb-saved">&#10003; Guardado</span>
        <button class="ftb-btn ghost">Guardar</button>
        <button class="ftb-btn primary">&#9654; Publicar</button>
        <div class="ftb-menu-anchor"><button class="ftb-btn ghost ftb-icon">&#8942;</button></div>
      </div>
    </div>

    <div class="pv-checks">
      <span><b>1</b> Barra superior <b>única</b> — sin Gemini ni botón Ejecutar <span class="pv-ok">OK</span></span>
      <span><b>2</b> Botón <b>+</b> del lienzo en tema claro (no negro)</span>
      <span><b>3</b> Switch: cada cable sale de <b>su</b> puerto</span>
    </div>

    <!-- Canvas -->
    <div class="n8n-viewport" style="position:relative;flex:1;min-height:0;overflow:hidden;">

      <!-- "+" button: light theme, theme variables -->
      <button class="n8n-canvas-add" title="Añadir nodo">+</button>

      <svg class="n8n-wires" width="900" height="420" style="position:absolute;left:0;top:0;overflow:visible;">
        <!-- switch at x=120,y=150, w=104, h=140 (4 outputs) -->
        <!-- port y = (140-66)/2 + i*22 = 37, 59, 81, 103  -> abs y = 187, 209, 231, 253 -->
        <path class="n8n-wire" fill="none" stroke="#3b82f6" d="M 228 187 C 290 187, 300 90, 372 90"/>
        <path class="n8n-wire" fill="none" stroke="#8b5cf6" d="M 228 209 C 290 209, 300 165, 372 165"/>
        <path class="n8n-wire" fill="none" stroke="#f59e0b" d="M 228 231 C 290 231, 300 240, 372 240"/>
        <path class="n8n-wire" fill="none" stroke="#64748b" d="M 228 253 C 290 253, 300 315, 372 315"/>
      </svg>

      <!-- Switch node: width 104, height 140, 4 outputs at 37/59/81/103 -->
      <div class="n8n-node" style="left:120px;top:150px;width:104px;height:140px;--accent:#ec4899;">
        <span class="n8n-port n8n-port-in" style="top:70px;border-color:#ec4899"></span>
        <span class="n8n-port n8n-port-out" style="top:37px;border-color:#3b82f6" title="Caso 1"></span>
        <span class="n8n-port n8n-port-out" style="top:59px;border-color:#8b5cf6" title="Caso 2"></span>
        <span class="n8n-port n8n-port-out" style="top:81px;border-color:#f59e0b" title="Caso 3"></span>
        <span class="n8n-port n8n-port-out" style="top:103px;border-color:#64748b" title="Default"></span>
        <div class="n8n-node-icon" style="color:#ec4899;border-color:#ec4899">&#9901;</div>
        <div class="n8n-node-body">
          <div class="n8n-node-title">Switch</div>
          <div class="n8n-node-sub">Enrutar</div>
        </div>
      </div>

      <!-- Targets, each aligned with its source port -->
      <div class="n8n-node" style="left:372px;top:56px;width:104px;height:68px;--accent:#3b82f6;">
        <span class="n8n-port n8n-port-in" style="top:34px;border-color:#3b82f6"></span>
        <div class="n8n-node-icon" style="color:#3b82f6;border-color:#3b82f6">&#9998;</div>
        <div class="n8n-node-body"><div class="n8n-node-title">Escribir</div><div class="n8n-node-sub">Caso 1</div></div>
      </div>
      <div class="n8n-node" style="left:372px;top:131px;width:104px;height:68px;--accent:#8b5cf6;">
        <span class="n8n-port n8n-port-in" style="top:34px;border-color:#8b5cf6"></span>
        <div class="n8n-node-icon" style="color:#8b5cf6;border-color:#8b5cf6">&#9633;</div>
        <div class="n8n-node-body"><div class="n8n-node-title">Click</div><div class="n8n-node-sub">Caso 2</div></div>
      </div>
      <div class="n8n-node" style="left:372px;top:206px;width:104px;height:68px;--accent:#f59e0b;">
        <span class="n8n-port n8n-port-in" style="top:34px;border-color:#f59e0b"></span>
        <div class="n8n-node-icon" style="color:#f59e0b;border-color:#f59e0b">&#9633;</div>
        <div class="n8n-node-body"><div class="n8n-node-title">Scroll</div><div class="n8n-node-sub">Caso 3</div></div>
      </div>
      <div class="n8n-node" style="left:372px;top:281px;width:104px;height:68px;--accent:#64748b;">
        <span class="n8n-port n8n-port-in" style="top:34px;border-color:#64748b"></span>
        <div class="n8n-node-icon" style="color:#64748b;border-color:#64748b">&#9675;</div>
        <div class="n8n-node-body"><div class="n8n-node-title">Default</div><div class="n8n-node-sub">Resto</div></div>
      </div>
    </div>

    <!-- Collapsed logs strip -->
    <div class="flow-logs collapsed">
      <div class="flogs-head">
        <button class="flogs-toggle">&#9656; Registros <span class="flogs-badge">3</span> &#8964;</button>
        <div class="flogs-actions">
          <button>&#9713; Historial</button>
          <button>Limpiar</button>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
