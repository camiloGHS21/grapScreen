<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="utf-8">
<title>grapScreen — canvas con panel lateral a 900 px</title>
<link rel="stylesheet" href="styles.css">
<style>
  html, body { margin: 0; padding: 0; background: var(--bg); }
  .shell { display: grid; grid-template-columns: 86px 1fr; height: 100vh; }
  aside { height: 100vh; padding: 20px 10px; display: flex; flex-direction: column; border-right: 1px solid var(--line); background: var(--s1); }
  .brand { display: flex; justify-content: center; margin-bottom: 36px; }
  .brand b { width: 34px; height: 34px; display: grid; place-items: center; border-radius: 11px; background: var(--red); color: #fff; font-weight: 800; }
  .editor { display: flex; gap: 10px; padding: 10px; align-items: stretch; }
  .canvas-wrap { position: relative; flex: 1 1 auto; min-width: 0; border-radius: 16px; overflow: hidden; background: var(--bg); border: 1px solid var(--line); }
  .n8n-world { position: absolute; top: 0; left: 0; }
  .node-a { position: absolute; left: 30px; top: 100px; }
  .node-b { position: absolute; left: 290px; top: 100px; }
</style>
</head>
<body>
<div class="shell">
  <aside>
    <div class="brand"><b>G</b></div>
  </aside>
  <div class="editor">
    <div class="canvas-wrap">
      <div class="n8n-world">
        <div class="n8n-node node-a" style="width:240px">
          <div class="n8n-node-icon" style="background:rgba(37,211,102,.12);color:#25d366">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
          </div>
          <div class="n8n-node-text">
            <div class="n8n-node-title">WhatsApp Trigger</div>
            <div class="n8n-node-sub">Trigger</div>
          </div>
          <div class="n8n-node-port n8n-node-port-out" style="top:38px"></div>
        </div>
        <div class="n8n-node node-b" style="width:240px">
          <div class="n8n-node-icon" style="background:rgba(234,179,8,.12);color:#eab308">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
          </div>
          <div class="n8n-node-text">
            <div class="n8n-node-title">Esperar</div>
            <div class="n8n-node-sub">Delay</div>
          </div>
          <div class="n8n-node-port n8n-node-port-in" style="top:38px"></div>
        </div>
      </div>
    </div>
    <!-- Side panel mock -->
    <div class="flow-side-panel" style="flex:0 0 320px">
      <div class="fsp-head">
        <div class="fsp-head-text">
          <div class="fsp-eyebrow">CONSTRUIR EL FLUJO</div>
          <h2 class="fsp-title">Añadir nodos</h2>
          <div class="fsp-sub">Haz clic en un nodo para ponerlo en el lienzo.</div>
        </div>
      </div>
      <div class="fsp-search"><input type="text" placeholder="Buscar nodo…" style="width:100%;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--s2);color:var(--text);font:500 12px Manrope" /></div>
      <div class="fsp-scroll" style="padding:12px 14px">
        <div class="fsp-section">
          <div class="fsp-section-title">Explorar categorías</div>
          <button class="fsp-row" style="display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--s1);cursor:pointer;width:100%;text-align:left;margin-bottom:6px">
            <span style="width:28px;height:28px;border-radius:7px;background:rgba(255,109,90,.12);color:#ff6d5a;display:grid;place-items:center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg></span>
            <span style="flex:1;font:600 12.5px Manrope;color:var(--text)">Disparadores</span>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
          </button>
          <button class="fsp-row" style="display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--s1);cursor:pointer;width:100%;text-align:left">
            <span style="width:28px;height:28px;border-radius:7px;background:rgba(110,88,242,.12);color:#6E58F2;display:grid;place-items:center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18"/></svg></span>
            <span style="flex:1;font:600 12.5px Manrope;color:var(--text)">Aplicaciones</span>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
